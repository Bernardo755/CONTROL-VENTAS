
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mueblería Rosa · Gestión de ventas</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
color-scheme:light;--bg:#faf8ff;--card:#fff;--ink:#3f3550;--mut:#8f86a3;--pk:#e88fb5;--pk2:#c9598f;--soft:#f5f0ff;--line:#ebe4f7;--ok:#4caf87;--bad:#e4677f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
header{background:linear-gradient(135deg,#ebe1fb,#fcdbe9);color:#4a3560;padding:18px 20px}
header h1{margin:0;font-size:20px}header p{margin:2px 0 0;opacity:.85;font-size:13px}
nav{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{border:0;background:var(--soft);color:var(--pk2);padding:9px 15px;border-radius:99px;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pk);color:#fff}
main{max-width:1050px;margin:0 auto;padding:6px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(120,90,170,.08)}
h2{margin:0 0 12px;font-size:17px}h3{margin:0 0 8px;font-size:15px;color:var(--pk2)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi small{color:var(--mut)}.kpi b{display:block;font-size:22px;color:var(--pk2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:8px}
label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:3px;flex:1;min-width:110px}
input,select,textarea{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pk);border-color:transparent}
.btn{border:0;background:var(--pk);color:#fff;padding:9px 16px;border-radius:10px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--pk2)}.btn.g{background:var(--soft);color:var(--pk2)}.btn.s{padding:5px 10px;font-size:12px}.btn.d{background:#fff0f3;color:var(--bad)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-size:12px;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.r{text-align:right}.tag{background:var(--soft);color:var(--pk2);padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.low{color:var(--bad);font-weight:700}.ok{color:var(--ok);font-weight:600}
.bar{height:8px;background:var(--soft);border-radius:9px;min-width:60px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#d9c8f5,#f2a1c2);border-radius:9px}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tot{font-size:20px;font-weight:800;color:var(--pk2)}
.chip{display:inline-block;margin-top:8px;background:rgba(255,255,255,.75);color:#4a3560;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600}.chip.ok{background:#4caf87;color:#fff}.chip.bad{background:#e4677f;color:#fff}
.plist{max-height:270px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}.pi{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}.pi:hover{background:var(--soft)}.pi.off{opacity:.45;cursor:not-allowed}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--pk2);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:9}
.empty{color:var(--mut);padding:14px;text-align:center}

/* ===== Nuevo: historial moderno ===== */
.hrow{display:grid;grid-template-columns:96px 1.1fr 1.8fr 112px 124px 112px 88px;gap:14px;align-items:start;padding:14px 8px;border-bottom:1px solid var(--line)}
.hrow.hd{color:var(--mut);font-size:12px;font-weight:600;padding:6px}
.hrow:not(.hd):hover{background:var(--soft);border-radius:12px}
.hrow small{color:var(--mut)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.pill.ok{background:#e4f6ee;color:var(--ok)}.pill.bad{background:#fff0f3;color:var(--bad)}
.hitems{display:flex;flex-direction:column;gap:2px;font-size:13px}
.hsum{color:var(--mut);font-size:13px;margin:4px 0 8px}
@media(max-width:760px){.hrow{grid-template-columns:1fr 1fr}.hrow.hd{display:none}.lb{display:block!important}}

/* ===== Alerta de cobranza ===== */
.alert{background:#fff7e6;border-color:#f5d48a}

/* ===== Reportes desplegables ===== */
details.rep{padding:0}
details.rep>summary{cursor:pointer;list-style:none;padding:14px 16px;font-weight:700;color:var(--pk2)}
details.rep>summary::-webkit-details-marker{display:none}
details.rep>summary::before{content:'▸';display:inline-block;margin-right:8px;transition:transform .15s}
details.rep[open]>summary::before{transform:rotate(90deg)}
details.rep>summary small{color:var(--mut);font-weight:500}
details.rep>.tw{padding:0 16px 14px}

.hrow.hd .sh{cursor:pointer;user-select:none}.hrow.hd .sh:hover{color:var(--pk2)}

/* ===== Historial: columnas ordenadas ===== */
.hrow .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.hrow .num b{display:block}
.hrow .pm{font-size:12px;color:var(--mut);margin-top:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hrow .est .pill{white-space:nowrap}
.hrow .acts{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.lb{display:none;font-size:11px;color:var(--mut)}
</style></head><body>
<header><h1>🌸 Mueblería Rosa</h1><p>Ventas, inventario y reportes en un solo lugar</p><span id="st" class="chip">…</span> <button class="chip" style="border:0;cursor:pointer" onclick="App.refresh()">↻ Actualizar</button></header>
<nav id="nav"></nav><main id="app"></main>
<script>
/* ===== CONFIGURACIÓN: datos de tu Google Sheets ===== */
const CONFIG={
  SCRIPT_URL:'https://script.google.com/macros/s/AKfycbz4WB11weturit6RcqILs0ybA2SCYv_FeAJ22R5L9WlIRTH86A60wbtGav7w8Qo-W7Z/exec',
  SPREADSHEET_ID:'1Lz19FsXfgJG_oI6aM_vvwv_egehUrtWjCLgi300LmSE',
  TOKEN:'Lizalfa2' // debe ser igual al TOKEN de Code.gs
};

/* ===== MÓDULO: Utilidades ===== */
const U={
  money:n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n||0),
  esc:s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  r2:n=>Math.round((n+Number.EPSILON)*100)/100,
  d:t=>{const [y,m,d]=t.split('-').map(Number);return new Date(y,m-1,d)},
  f:dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'),
  today(){return U.f(new Date())},
  next(t,freq,k=1){const dt=U.d(t);
    if(freq==='mensual'){const day=dt.getDate();dt.setDate(1);dt.setMonth(dt.getMonth()+k);dt.setDate(Math.min(day,new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate()))}
    else dt.setDate(dt.getDate()+k*(freq==='semanal'?7:15));return U.f(dt)},
  uid:()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),
  $:id=>document.getElementById(id),
  norm:t=>String(t??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(), // sin acentos/mayúsculas
  toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}
};
const FREQ={semanal:'Semanal',quincenal:'Quincenal',mensual:'Mensual'};
// 'donacion' liquida saldo (no es deuda) pero NO cuenta como ingreso en reportes
const METHODS={efectivo:'💵 Efectivo',transferencia:'🏦 Transferencia',tarjeta:'💳 Tarjeta',donacion:'🎁 Donación'};

/* ===== MÓDULO: Store (Google Sheets vía Apps Script) ===== */
const Store={
  data:{products:[],clients:[],sales:[]},ready:false,timer:null,
  status(t,c){const e=U.$('st');if(e){e.textContent=t;e.className='chip '+(c||'')}},
  async load(){
    if(!CONFIG.SCRIPT_URL){ // modo local de respaldo
      try{const r=localStorage.getItem('muebleria-local');if(r)this.data=JSON.parse(r)}catch(e){}
      this.ready=true;return this.status('Modo local (sin Sheets)','bad')}
    this.status('Cargando…');
    try{
      const q='?action=getAll&token='+encodeURIComponent(CONFIG.TOKEN)+'&id='+encodeURIComponent(CONFIG.SPREADSHEET_ID);
      const j=await (await fetch(CONFIG.SCRIPT_URL+q)).json();
      if(!j.ok)throw new Error(j.error);
      this.data=j.data;this.ready=true;this.status('Sincronizado ✔','ok');
    }catch(e){this.status('Error al cargar: '+e.message,'bad')}
  },
  save(){
    if(!this.ready)return; // evita sobrescribir la hoja si la carga falló
    try{localStorage.setItem('muebleria-local',JSON.stringify(this.data))}catch(e){}
    if(!CONFIG.SCRIPT_URL)return;
    this.status('Guardando…');clearTimeout(this.timer);this.timer=setTimeout(()=>this.push(),700);
  },
  async push(){
    try{
      const r=await fetch(CONFIG.SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'saveAll',token:CONFIG.TOKEN,id:CONFIG.SPREADSHEET_ID,data:this.data})});
      const j=await r.json();if(!j.ok)throw new Error(j.error);this.status('Guardado en Sheets ✔','ok');
    }catch(e){this.status('Error al guardar: '+e.message,'bad')}
  }
};

/* ===== MÓDULO: Catálogo / Inventario ===== */
const Catalog={
  q:'', // texto del buscador
  add(p){Store.data.products.push({id:U.uid(),...p});Store.save()},
  get:id=>Store.data.products.find(p=>p.id===id),
  update(id,f){Object.assign(this.get(id),f);Store.save()},
  remove(id){Store.data.products=Store.data.products.filter(p=>p.id!==id);Store.save()},
  uniq:k=>[...new Set(Store.data.products.map(p=>p[k]).filter(Boolean))].sort(),
  categories:()=>[...new Set(Store.data.products.map(p=>p.cat))].sort(),
  filtered(){const q=U.norm(this.q).trim();
    return Store.data.products.filter(p=>!q||U.norm([p.name,p.cat,p.madera,p.tela].join(' ')).includes(q))},
  rows(){
    const ps=this.filtered();
    return ps.map(p=>`<tr><td>${U.esc(p.name)}</td><td><input style="min-width:110px" list="cats" value="${U.esc(p.cat)}" onchange="Catalog.update('${p.id}',{cat:this.value.trim()||'General'});U.toast('Tipo actualizado')"></td>
      <td><input style="min-width:100px" list="mads" value="${U.esc(p.madera||'')}" onchange="Catalog.update('${p.id}',{madera:this.value.trim()});U.toast('Madera actualizada')"></td>
      <td><input style="min-width:100px" list="tels" value="${U.esc(p.tela||'')}" onchange="Catalog.update('${p.id}',{tela:this.value.trim()});U.toast('Tela actualizada')"></td>
      <td class="r"><input style="width:110px;text-align:right" type="number" value="${p.price}" onchange="Catalog.update('${p.id}',{price:+this.value});U.toast('Precio actualizado')"></td>
      <td class="r ${p.stock<=2?'low':''}"><input style="width:80px;text-align:right" type="number" value="${p.stock}" onchange="Catalog.update('${p.id}',{stock:+this.value});App.render()"></td>
      <td class="r" style="white-space:nowrap"><input id="sa-${p.id}" type="number" min="1" value="1" style="width:64px;display:inline-block"> <button class="btn g s" onclick="Catalog.ui.addStock('${p.id}')">+ Stock</button></td>
      <td class="r"><button class="btn d s" onclick="Catalog.ui.del('${p.id}')">Eliminar</button></td></tr>`).join('')
      ||'<tr><td colspan=8 class="empty">Sin muebles'+(this.q?' para «'+U.esc(this.q)+'»':'')+'</td></tr>'},
  view(){
    const ps=Store.data.products;
    return `<div class="card"><h2>Agregar mueble al catálogo</h2><div class="row">
      <label>Nombre<input id="pn"></label><label>Tipo / categoría<input id="pc" list="cats" placeholder="Sala, Comedor…"></label>
      <label>Madera<input id="pm" list="mads" placeholder="Pino, Encino…"></label><label>Tela<input id="pt" list="tels" placeholder="Lino, Piel…"></label>
      <label>Precio<input id="pp" type="number" min="0"></label><label>Stock<input id="ps" type="number" min="0" value="1"></label>
      <button class="btn" onclick="Catalog.ui.add()">Agregar</button></div>
      <datalist id="cats">${this.categories().map(c=>`<option value="${U.esc(c)}">`).join('')}</datalist>
      <datalist id="mads">${this.uniq('madera').map(c=>`<option value="${U.esc(c)}">`).join('')}</datalist>
      <datalist id="tels">${this.uniq('tela').map(c=>`<option value="${U.esc(c)}">`).join('')}</datalist></div>
    <div class="card"><h2>Catálogo (<span id="ccount">${this.filtered().length}</span> de ${ps.length})</h2>
      <div class="row"><label>🔎 Buscar en el catálogo (nombre, tipo, madera o tela)<input id="cq" type="search" placeholder="Ej. sofá, pino…" value="${U.esc(this.q)}" oninput="Catalog.ui.search(this.value)"></label></div>
      <div class="tw"><table><tr><th>Mueble</th><th>Tipo</th><th>Madera</th><th>Tela</th><th class="r">Precio</th><th class="r">Stock</th><th class="r">Sumar stock</th><th></th></tr>
      <tbody id="cbody">${this.rows()}</tbody></table></div><small style="color:var(--mut)">Stock en rojo = 2 piezas o menos.</small></div>`},
  ui:{
    add(){const name=U.$('pn').value.trim(),cat=U.$('pc').value.trim()||'General',madera=U.$('pm').value.trim(),tela=U.$('pt').value.trim(),price=+U.$('pp').value,stock=+U.$('ps').value;
      if(!name||price<=0)return U.toast('Nombre y precio son requeridos');
      Catalog.add({name,cat,madera,tela,price,stock});App.render()},
    del(id){if(confirm('¿Eliminar este mueble del catálogo (descontinuado)? Las ventas anteriores conservan su registro.')){Catalog.remove(id);App.render()}},
    search(v){Catalog.q=v;U.$('cbody').innerHTML=Catalog.rows();U.$('ccount').textContent=Catalog.filtered().length},
    addStock(id){const q=Math.floor(+U.$('sa-'+id).value);if(!(q>0))return U.toast('Escribe una cantidad válida');
      const p=Catalog.get(id);Catalog.update(id,{stock:(+p.stock||0)+q});U.toast('+'+q+' al stock de '+p.name);
      U.$('cbody').innerHTML=Catalog.rows()}
  }
};

/* ===== MÓDULO: Clientes ===== */
const Clients={
  add(c){const n={id:U.uid(),created:U.today(),...c};Store.data.clients.push(n);Store.save();return n},
  get:id=>Store.data.clients.find(c=>c.id===id),
  name(id){return this.get(id)?.name||'Mostrador'},
  remove(id){Store.data.clients=Store.data.clients.filter(c=>c.id!==id);Store.save()},
  view(){
    const cs=Store.data.clients,S=Store.data.sales;
    return `<div class="card"><h2>Nuevo cliente</h2><div class="row">
      <label>Nombre<input id="cn"></label><label>Teléfono<input id="ct"></label><label>Dirección<input id="ca"></label>
      <button class="btn" onclick="Clients.ui.add()">Guardar</button></div></div>
    <div class="card"><h2>Clientes (${cs.length})</h2><div class="tw"><table><tr><th>Nombre</th><th>Teléfono</th><th>Dirección</th><th>Registro</th><th class="r">Compras</th><th class="r">Saldo</th><th></th></tr>
    ${cs.map(c=>{const v=S.filter(s=>s.clientId===c.id);return `<tr><td>${U.esc(c.name)}</td><td>${U.esc(c.phone)}</td><td>${U.esc(c.addr)}</td>
      <td>${U.esc(c.created||'—')}</td>
      <td class="r">${U.money(v.reduce((a,s)=>a+s.total,0))}</td><td class="r ${v.some(s=>Sales.balance(s)>0)?'low':''}">${U.money(v.reduce((a,s)=>a+Sales.balance(s),0))}</td>
      <td class="r"><button class="btn d s" onclick="Clients.ui.del('${c.id}')">Eliminar</button></td></tr>`}).join('')||'<tr><td colspan=7 class="empty">Sin clientes</td></tr>'}
    </table></div></div>`},
  ui:{
    add(){const name=U.$('cn').value.trim();if(!name)return U.toast('Escribe el nombre');
      Clients.add({name,phone:U.$('ct').value,addr:U.$('ca').value});App.render()},
    del(id){
      const debt=Store.data.sales.filter(s=>s.clientId===id).reduce((a,s)=>a+Sales.balance(s),0);
      if(debt>0)return U.toast('No se puede eliminar: tiene saldo pendiente ('+U.money(debt)+')');
      if(!confirm('¿Eliminar este cliente? Sus ventas pasadas aparecerán como «Mostrador».'))return;
      Clients.remove(id);if(Sales.cid===id)Sales.cid='';App.render()}
  }
};

/* ===== MÓDULO: Ventas ===== */
const Sales={
  cart:[],pays:[],cid:'',date:'',newCli:false,q:'',obs:'',plan:{n:0,freq:'semanal',start:''},
  paid:s=>s.payments.reduce((a,p)=>a+p.amount,0), // incluye donaciones: liquidan saldo
  balance(s){return Math.max(0,U.r2(s.total-this.paid(s)))},
  total(){return this.cart.reduce((a,i)=>a+i.qty*i.price,0)},
  create(clientId){
    const items=this.cart.map(i=>({...i})),total=this.total();
    items.forEach(i=>{const p=Catalog.get(i.pid);if(p)p.stock-=i.qty});   // descuenta inventario
    const s={id:U.uid(),date:U.$('sd').value||U.today(),clientId,items,total,obs:this.obs.trim(),
      payments:this.pays.filter(p=>p.amount>0).map(p=>({...p,date:U.$('sd').value||U.today()}))};
    s.freq=this.plan.freq;
    s.plan=this.schedule(U.r2(total-this.paid(s)),this.plan.n,this.plan.freq,this.plan.start||U.next(s.date,this.plan.freq));
    Store.data.sales.push(s);Store.save();this.cart=[];this.pays=[];this.obs='';this.plan={n:0,freq:'semanal',start:''};return s},
  schedule(bal,n,freq,start){ // reparte el saldo en n plazos; el último absorbe el redondeo
    const o=[];if(!(n>0)||bal<=0)return o;const base=Math.floor(bal/n*100)/100;
    for(let i=0;i<n;i++)o.push({n:i+1,due:U.next(start,freq,i),amount:i===n-1?U.r2(bal-base*(n-1)):base,paid:0});return o},
  applyPayment(s,amt){let left=amt;(s.plan||[]).forEach(i=>{const need=U.r2(i.amount-i.paid);
    if(left>0&&need>0){const t=Math.min(left,need);i.paid=U.r2(i.paid+t);left=U.r2(left-t)}})},
  rebuild(s){(s.plan||[]).forEach(i=>i.paid=0);s.payments.filter(p=>p.plan).forEach(p=>this.applyPayment(s,p.amount))},
  nextDue:s=>(s.plan||[]).find(i=>i.paid<i.amount),
  instStatus:i=>i.paid>=i.amount?'Pagado':(i.due<U.today()?'Vencido':(i.paid>0?'Parcial':'Pendiente')),
  planView(bal){
    if(bal<=0.009)return '';
    const pl=this.plan,start=pl.start||U.next(this.date||U.today(),pl.freq),sch=this.schedule(U.r2(bal),pl.n,pl.freq,start);
    return `<div style="background:var(--soft);border-radius:12px;padding:12px;margin:10px 0"><h3>Saldo a plazos (${U.money(bal)})</h3>
      <div class="row"><label>Nº de plazos<input type="number" min="0" max="104" value="${pl.n}" onchange="Sales.plan.n=Math.max(0,Math.floor(+this.value||0));App.render()"></label>
      <label>Periodicidad<select onchange="Sales.plan.freq=this.value;Sales.plan.start='';App.render()">${Object.entries(FREQ).map(([k,l])=>`<option value="${k}" ${pl.freq===k?'selected':''}>${l}</option>`).join('')}</select></label>
      <label>1er pago<input type="date" value="${start}" onchange="Sales.plan.start=this.value;App.render()"></label></div>
      ${sch.length?`<div class="tw"><table><tr><th>#</th><th>Vence</th><th class="r">Monto</th></tr>${sch.map(i=>`<tr><td>${i.n}</td><td>${i.due}</td><td class="r">${U.money(i.amount)}</td></tr>`).join('')}</table></div>`
      :'<small style="color:var(--mut)">Con 0 plazos el saldo queda abierto, sin calendario.</small>'}</div>`},
  list(){ // catálogo filtrado por lo que se escribe (sin acentos ni mayúsculas)
    const n=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),q=n(this.q).trim();
    const ps=Store.data.products.filter(p=>!q||n(p.name+' '+p.cat+' '+(p.madera||'')+' '+(p.tela||'')).includes(q));
    return ps.map(p=>`<div class="pi ${p.stock<1?'off':''}" ${p.stock>0?`onclick="Sales.ui.addItem('${p.id}')"`:''}>

      <div class="r"><b>${U.money(p.price)}</b><br><small style="color:var(--pk2)">${p.stock>0?'+ Agregar':''}</small></div></div>`).join('')
      ||'<div class="empty">Sin resultados para «'+U.esc(this.q)+'»</div>'},
  breakdown(){ // desglose por artículo con descuento (se muestra junto a la forma de pago)
    if(!this.cart.length)return '';
    const desc=this.cart.reduce((a,i)=>a+i.qty*(i.disc||0),0);
    return `<h3>Desglose por artículo</h3><div class="tw"><table><tr><th>Pieza</th><th class="r">Cant.</th><th class="r">Precio lista</th><th class="r">Descuento c/u</th><th class="r">Subtotal</th></tr>
      ${this.cart.map((i,k)=>`<tr><td>${U.esc(i.name)}</td><td class="r">${i.qty}</td><td class="r">${U.money(i.list)}</td>
        <td class="r"><input style="width:100px;text-align:right" type="number" min="0" max="${i.list}" value="${i.disc||0}" onchange="Sales.ui.setDisc(${k},this.value)"></td>
        <td class="r">${U.money(i.qty*i.price)}</td></tr>`).join('')}</table></div>
      <small style="color:var(--mut)">Descuento total aplicado: <b>${U.money(desc)}</b></small>
      <label style="margin:10px 0">Observaciones<textarea rows="2" placeholder="Particularidades de la venta (entrega, acabados, acuerdos…)" oninput="Sales.obs=this.value">${U.esc(this.obs)}</textarea></label>`},
  view(){
    const ps=Store.data.products.filter(p=>p.stock>0),tot=this.total(),paid=this.pays.reduce((a,p)=>a+(+p.amount||0),0);
    return `<div class="two"><div class="card"><h2>1 · Cliente y muebles</h2>
      <div class="row"><label>Fecha<input id="sd" type="date" value="${this.date||U.today()}" onchange="Sales.date=this.value"></label>
      <label>Cliente<select id="sc" onchange="Sales.cid=this.value">
        <option value="">Mostrador (sin registro)</option>${Store.data.clients.map(c=>`<option value="${c.id}" ${c.id===this.cid?'selected':''}>${U.esc(c.name)}</option>`).join('')}</select></label>
      <button class="btn g" onclick="Sales.newCli=!Sales.newCli;App.render()">${this.newCli?'Cerrar':'+ Nuevo cliente'}</button></div>
      ${this.newCli?`<div class="row" style="background:var(--soft);padding:10px;border-radius:12px">
        <label>Nombre<input id="qn"></label><label>Teléfono<input id="qt"></label><label>Dirección<input id="qa"></label>
        <button class="btn" onclick="Sales.ui.addClient()">Guardar y usar</button></div>`:''}
      <div class="row"><label>🔎 Buscar mueble (nombre, tipo, madera o tela)<input id="sb" type="search" placeholder="Ej. sofá, recámara, mesa…" value="${U.esc(this.q)}" oninput="Sales.ui.search(this.value)"></label>
      <label style="max-width:90px">Cantidad<input id="sq" type="number" min="1" value="1"></label></div>
      <div id="plist" class="plist">${this.list()}</div>
      <div class="tw"><table><tr><th>Pieza</th><th class="r">Cant.</th><th class="r">Precio</th><th class="r">Subtotal</th><th></th></tr>
      ${this.cart.map((i,k)=>`<tr><td>${U.esc(i.name)}</td><td class="r">${i.qty}</td>
        <td class="r"><input style="width:100px;text-align:right" type="number" value="${i.price}" onchange="Sales.ui.setPrice(${k},this.value)"></td>
        <td class="r">${U.money(i.qty*i.price)}</td><td><button class="btn d s" onclick="Sales.cart.splice(${k},1);App.render()">✕</button></td></tr>`).join('')||'<tr><td colspan=5 class="empty">Agrega muebles a la venta</td></tr>'}</table></div>
      <p class="r">Total: <span class="tot">${U.money(tot)}</span></p></div>
    <div class="card"><h2>2 · Forma de pago</h2><p style="color:var(--mut);margin-top:0">Un solo pago o varios; combina efectivo, transferencia, tarjeta o donación (liquida saldo pero no cuenta como ingreso). Si queda saldo, se abona después en Historial.</p>
      ${this.breakdown()}
      ${this.pays.map((p,k)=>`<div class="row"><label>Método<select onchange="Sales.pays[${k}].method=this.value">${Object.entries(METHODS).map(([m,l])=>`<option value="${m}" ${p.method===m?'selected':''}>${l}</option>`).join('')}</select></label>
        <label>Monto<input type="number" min="0" value="${p.amount}" onchange="Sales.pays[${k}].amount=+this.value;App.render()"></label>
        <button class="btn d s" onclick="Sales.pays.splice(${k},1);App.render()">✕</button></div>`).join('')}
      <div class="row"><button class="btn g" onclick="Sales.ui.addPay()">+ Agregar pago</button>
      <button class="btn g" onclick="Sales.ui.fullPay()">Pagar total en 1 pago</button></div>

      ${this.planView(tot-paid)}
      <button class="btn" style="width:100%;padding:13px" onclick="Sales.ui.save()">✅ Registrar venta</button></div></div>`},
  ui:{
    search(v){Sales.q=v;U.$('plist').innerHTML=Sales.list()},
    addItem(id){const p=Catalog.get(id),q=+U.$('sq').value;if(!p||q<1)return;
      const inCart=Sales.cart.filter(i=>i.pid===p.id).reduce((a,i)=>a+i.qty,0);
      if(inCart+q>p.stock)return U.toast('Stock insuficiente (quedan '+p.stock+')');
      Sales.cart.push({pid:p.id,name:p.name,cat:p.cat,qty:q,price:p.price,list:p.price,disc:0});App.render()},
    addClient(){const name=U.$('qn').value.trim();if(!name)return U.toast('Escribe el nombre del cliente');
      const c=Clients.add({name,phone:U.$('qt').value,addr:U.$('qa').value});
      Sales.cid=c.id;Sales.newCli=false;U.toast('Cliente agregado');App.render()},
    // precio editado a mano → el descuento se recalcula contra el precio de lista
    setPrice(k,v){const i=Sales.cart[k];i.price=Math.max(0,+v);i.disc=Math.max(0,U.r2((i.list??i.price)-i.price));App.render()},
    // descuento por pieza → el precio final = lista - descuento
    setDisc(k,v){const i=Sales.cart[k];i.disc=Math.min(i.list,Math.max(0,+v||0));i.price=U.r2(i.list-i.disc);App.render()},
    addPay(){Sales.pays.push({method:'efectivo',amount:Math.max(0,Sales.total()-Sales.pays.reduce((a,p)=>a+(+p.amount||0),0))});App.render()},
    fullPay(){Sales.pays=[{method:'efectivo',amount:Sales.total()}];App.render()},
    save(){
      if(!Sales.cart.length)return U.toast('Agrega al menos un mueble');
      const paid=Sales.pays.reduce((a,p)=>a+(+p.amount||0),0);
      if(paid>Sales.total())return U.toast('Los pagos exceden el total');
      const cid=U.$('sc').value;
      if(paid<Sales.total()&&!cid&&!confirm('Queda saldo pendiente sin cliente registrado. ¿Continuar?'))return;
      Sales.create(cid);Sales.cid='';Sales.date='';U.toast('Venta registrada ✔');App.go('history')}
  },
  ui2:{},
};
Sales.ui.cancel=id=>{if(!confirm('¿Cancelar venta? Se regresan las piezas al stock.'))return;
  const s=Store.data.sales.find(x=>x.id===id);s.items.forEach(i=>{const p=Catalog.get(i.pid);if(p)p.stock+=i.qty});
  Store.data.sales=Store.data.sales.filter(x=>x.id!==id);Store.save();App.render()};

/* ===== MÓDULO: Historial de ventas (filtros, orden y formato moderno) ===== */
const History={
  f:{from:'',to:'',cid:'',item:'',bal:'',sort:'date_desc'},
  set(k,v){this.f[k]=v;this.refresh()},
  refresh(){const e=U.$('hres');if(e)e.innerHTML=this.results()},
  clear(){this.f={from:'',to:'',cid:'',item:'',bal:'',sort:'date_desc'};App.render()},
  // flecha del encabezado activo (▼ descendente / ▲ ascendente)
  arrow(k){const [c,d]=this.f.sort.split('_');return c===k?(d==='desc'?' ▼':' ▲'):''},
  // clic en encabezado: alterna ascendente/descendente
  sortBy(k){this.f.sort=this.f.sort===k+'_desc'?k+'_asc':k+'_desc';App.render()},
  rows(){
    const f=this.f,q=U.norm(f.item).trim();
    let S=Store.data.sales.filter(s=>{
      if(f.from&&s.date<f.from)return false;
      if(f.to&&s.date>f.to)return false;
      if(f.cid==='__m'?Clients.get(s.clientId):(f.cid&&s.clientId!==f.cid))return false;
      if(q&&!s.items.some(i=>U.norm(i.name+' '+i.cat).includes(q)))return false;
      if(f.bal==='con'&&Sales.balance(s)<=0)return false;
      if(f.bal==='sin'&&Sales.balance(s)>0)return false;
      return true});
    const cmp={date_desc:(a,b)=>b.date.localeCompare(a.date),date_asc:(a,b)=>a.date.localeCompare(b.date),
      client_asc:(a,b)=>Clients.name(a.clientId).localeCompare(Clients.name(b.clientId),'es'),
      client_desc:(a,b)=>Clients.name(b.clientId).localeCompare(Clients.name(a.clientId),'es'),
      total_desc:(a,b)=>b.total-a.total,total_asc:(a,b)=>a.total-b.total,
      status_desc:(a,b)=>Sales.balance(b)-Sales.balance(a),   // con más saldo primero
      status_asc:(a,b)=>Sales.balance(a)-Sales.balance(b)}[f.sort]; // liquidadas primero
    return S.sort(cmp)},
  results(){
    const S=this.rows(),tot=S.reduce((a,s)=>a+s.total,0),sal=S.reduce((a,s)=>a+Sales.balance(s),0);
    return `<div class="hsum">${S.length} venta(s) · Total ${U.money(tot)} · Saldo ${U.money(sal)}</div>
    <div class="hrow hd"><div class="sh" onclick="History.sortBy('date')">Fecha${this.arrow('date')}</div><div class="sh" onclick="History.sortBy('client')">Cliente${this.arrow('client')}</div><div>Muebles</div><div class="r sh" onclick="History.sortBy('total')">Total${this.arrow('total')}</div><div class="r">Pagado</div><div class="sh" onclick="History.sortBy('status')">Estado${this.arrow('status')}</div><div></div></div>
    ${S.map(s=>{const b=Sales.balance(s);return `<div class="hrow">
      <div><b>${s.date}</b></div>
      <div>${U.esc(Clients.name(s.clientId))}${s.obs?`<br><small>📝 ${U.esc(s.obs)}</small>`:''}</div>
      <div class="hitems">${s.items.map(i=>`<span>${i.qty}× ${U.esc(i.name)}${i.disc>0?` <small>(-${U.money(i.disc)} c/u)</small>`:''}</span>`).join('')}</div>
      <div class="r num"><span class="lb">Total</span><b>${U.money(s.total)}</b></div>
      <div class="r num"><span class="lb">Pagado</span><b>${U.money(Sales.paid(s))}</b>
        ${s.payments.map(p=>`<div class="pm">${METHODS[p.method].split(' ')[0]} ${U.money(p.amount)}</div>`).join('')}</div>
      <div class="est"><span class="pill ${b>0?'bad':'ok'}">${b>0?'Con saldo':'Liquidada'}</span>${b>0?`<div class="pm">Debe ${U.money(b)}</div>`:''}</div>
      <div class="acts">${b>0?`<button class="btn s" onclick="Collections.open('${s.id}')">Abonar</button>`:''}<button class="btn d s" onclick="Sales.ui.cancel('${s.id}')">Cancelar</button></div></div>`}).join('')||'<div class="empty">Sin ventas con esos filtros</div>'}`},
  view(){
    const f=this.f;
    return `<div class="card"><h2>Historial de ventas</h2>
      <div class="row"><label>Desde<input type="date" value="${f.from}" onchange="History.set('from',this.value)"></label>
      <label>Hasta<input type="date" value="${f.to}" onchange="History.set('to',this.value)"></label>
      <label>Cliente<select onchange="History.set('cid',this.value)"><option value="">Todos</option><option value="__m" ${f.cid==='__m'?'selected':''}>Mostrador</option>
        ${Store.data.clients.map(c=>`<option value="${c.id}" ${f.cid===c.id?'selected':''}>${U.esc(c.name)}</option>`).join('')}</select></label></div>
      <div class="row"><label>Mueble<input type="search" placeholder="Nombre o tipo" value="${U.esc(f.item)}" oninput="History.set('item',this.value)"></label>
      <label>Saldo<select onchange="History.set('bal',this.value)"><option value="">Todas</option><option value="con" ${f.bal==='con'?'selected':''}>Con saldo</option><option value="sin" ${f.bal==='sin'?'selected':''}>Liquidadas</option></select></label>
      <label>Ordenar por<select onchange="History.set('sort',this.value)">
        ${[['date_desc','Fecha (reciente)'],['date_asc','Fecha (antigua)'],['client_asc','Cliente (A-Z)'],['client_desc','Cliente (Z-A)'],['total_desc','Total (mayor)'],['total_asc','Total (menor)'],['status_desc','Estado (con saldo primero)'],['status_asc','Estado (liquidadas primero)']].map(([k,l])=>`<option value="${k}" ${f.sort===k?'selected':''}>${l}</option>`).join('')}</select></label>
      <button class="btn g" onclick="History.clear()">Limpiar</button></div>
      <div id="hres">${this.results()}</div></div>`}
};
Sales.history=()=>History.view(); // compatibilidad con el nombre original

/* ===== MÓDULO: Cobranza (abonos y plazos) ===== */
const Collections={
  sel:'',
  open(id){this.sel=id;App.go('collect');setTimeout(()=>{const e=U.$('det');e&&e.scrollIntoView({behavior:'smooth'})},60)},
  cur:()=>Store.data.sales.find(x=>x.id===Collections.sel),
  overdue:s=>(s.plan||[]).filter(i=>i.paid<i.amount&&i.due<U.today()).reduce((a,i)=>a+U.r2(i.amount-i.paid),0),
  // Alertas: cuentas con pagos vencidos o que vencen hoy
  alerts(){
    const T=U.today(),P=Store.data.sales.filter(s=>Sales.balance(s)>0);
    const ven=P.filter(s=>this.overdue(s)>0),hoy=P.filter(s=>(s.plan||[]).some(i=>i.paid<i.amount&&i.due===T));
    return {ven,hoy,monto:ven.reduce((a,s)=>a+this.overdue(s),0),n:new Set([...ven,...hoy].map(s=>s.id)).size}},
  // Recordatorio por WhatsApp (se abre con el mensaje escrito; tú lo envías)
  wa(id){
    const s=Store.data.sales.find(x=>x.id===id),c=Clients.get(s&&s.clientId);
    let ph=String(c&&c.phone||'').replace(/\D/g,'');
    if(!ph)return U.toast('El cliente no tiene teléfono registrado');
    if(ph.length===10)ph='52'+ph; // México
    const ov=this.overdue(s),nd=Sales.nextDue(s),bal=Sales.balance(s);
    const msg='Hola '+c.name+', le saludamos de Mueblería Rosa. '+
      (ov>0?'Le recordamos que tiene un pago vencido por '+U.money(ov)+'. ':(nd?'Le recordamos su próximo pago de '+U.money(U.r2(nd.amount-nd.paid))+' con fecha '+nd.due+'. ':''))+
      'Su saldo total pendiente es '+U.money(bal)+'. ¡Gracias por su preferencia!';
    window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(msg),'_blank')},
  pay(){const s=this.cur(),a=U.r2(+U.$('aa').value),bal=Sales.balance(s);
    if(!(a>0))return U.toast('Escribe un monto');if(a>bal)return U.toast('El abono excede el saldo ('+U.money(bal)+')');
    s.payments.push({method:U.$('am').value,amount:a,date:U.$('ad').value||U.today(),plan:true});
    Sales.applyPayment(s,a);Store.save();U.toast('Abono registrado ✔');App.render()},
  undo(k){if(!confirm('¿Eliminar este pago?'))return;const s=this.cur();s.payments.splice(k,1);Sales.rebuild(s);Store.save();App.render()},
  setDue(k,v){if(!v)return;this.cur().plan[k].due=v;Store.save();App.render()},
  reprog(){const s=this.cur(),n=Math.floor(+U.$('rn').value),fr=U.$('rf').value,st=U.$('rs').value,bal=Sales.balance(s);
    if(!(n>0)||!st||bal<=0)return U.toast('Revisa plazos y fecha');
    s.plan=s.plan||[];const kept=[];
    s.plan.forEach(i=>{if(i.paid>=i.amount)kept.push(i);else if(i.paid>0){i.amount=i.paid;kept.push(i)}});
    kept.sort((a,b)=>a.n-b.n).forEach((i,k)=>i.n=k+1);
    const nw=Sales.schedule(bal,n,fr,st);nw.forEach((i,k)=>i.n=kept.length+k+1);
    s.plan=[...kept,...nw];s.freq=fr;Store.save();U.toast('Plan reprogramado');App.render()},
  detail(){
    const s=this.cur();if(!s)return '';const bal=Sales.balance(s),nd=Sales.nextDue(s),pl=s.plan||[];
    return `<div class="card" id="det"><h2>Abonos · ${U.esc(Clients.name(s.clientId))} · venta del ${s.date}</h2>
      <p>Total <b>${U.money(s.total)}</b> · Pagado <b>${U.money(Sales.paid(s))}</b> · Saldo <b class="${bal>0?'low':'ok'}">${U.money(bal)}</b></p>
      <small style="color:var(--mut)">${s.items.map(i=>`${i.qty}× ${U.esc(i.name)}`).join(', ')}</small>
      ${pl.length?`<div class="tw"><table><tr><th>#</th><th>Vence</th><th class="r">Monto</th><th class="r">Pagado</th><th class="r">Pendiente</th><th>Estado</th></tr>
        ${pl.map((i,k)=>{const st=Sales.instStatus(i);return `<tr><td>${i.n}</td>
        <td>${i.paid<i.amount?`<input type="date" style="width:150px" value="${i.due}" onchange="Collections.setDue(${k},this.value)">`:i.due}</td>
        <td class="r">${U.money(i.amount)}</td><td class="r">${U.money(i.paid)}</td><td class="r">${U.money(U.r2(i.amount-i.paid))}</td>
        <td class="${st==='Pagado'?'ok':st==='Vencido'?'low':''}">${st}</td></tr>`}).join('')}</table></div>`:'<p style="color:var(--mut)">Esta venta no tiene calendario de plazos (saldo abierto).</p>'}
      ${bal>0?`<h3 style="margin-top:14px">Registrar abono</h3><div class="row"><label>Fecha<input id="ad" type="date" value="${U.today()}"></label>
        <label>Método<select id="am">${Object.entries(METHODS).map(([m,l])=>`<option value="${m}">${l}</option>`).join('')}</select></label>
        <label>Monto<input id="aa" type="number" min="0" step="0.01" value="${nd?U.r2(nd.amount-nd.paid):bal}"></label>
        <button class="btn" onclick="Collections.pay()">Registrar abono</button><button class="btn g" onclick="U.$('aa').value=${bal}">Liquidar saldo</button></div>
        <h3 style="margin-top:14px">Reprogramar saldo pendiente</h3><div class="row"><label>Nº plazos<input id="rn" type="number" min="1" value="${Math.max(1,pl.filter(i=>i.paid<i.amount).length)}"></label>
        <label>Periodicidad<select id="rf">${Object.entries(FREQ).map(([k,l])=>`<option value="${k}" ${(s.freq||'semanal')===k?'selected':''}>${l}</option>`).join('')}</select></label>
        <label>1er pago<input id="rs" type="date" value="${U.next(U.today(),s.freq||'semanal')}"></label><button class="btn g" onclick="Collections.reprog()">Reprogramar</button></div>`:'<p class="ok">✔ Venta liquidada</p>'}
      <h3 style="margin-top:14px">Pagos registrados</h3><div class="tw"><table><tr><th>Fecha</th><th>Método</th><th class="r">Monto</th><th></th></tr>
      ${s.payments.map((p,k)=>`<tr><td>${p.date}</td><td>${METHODS[p.method]}</td><td class="r">${U.money(p.amount)}</td>
        <td class="r">${p.plan||!pl.length?`<button class="btn d s" onclick="Collections.undo(${k})">Eliminar</button>`:'<small>Pago inicial</small>'}</td></tr>`).join('')||'<tr><td colspan=4 class="empty">Sin pagos</td></tr>'}</table></div></div>`},
  view(){
    const P=Store.data.sales.filter(s=>Sales.balance(s)>0),T=U.today(),wk=U.next(T,'semanal');
    const saldo=P.reduce((a,s)=>a+Sales.balance(s),0),venc=P.reduce((a,s)=>a+this.overdue(s),0);
    const prox=P.flatMap(s=>(s.plan||[]).filter(i=>i.paid<i.amount&&i.due>=T&&i.due<=wk)).reduce((a,i)=>a+U.r2(i.amount-i.paid),0);
    const key=s=>(Sales.nextDue(s)||{due:'9999'}).due,sorted=[...P].sort((a,b)=>key(a).localeCompare(key(b)));
    return `<div class="grid" style="margin-bottom:14px"><div class="kpi"><small>Por cobrar</small><b>${U.money(saldo)}</b></div>
      <div class="kpi"><small>Vencido</small><b style="color:var(--bad)">${U.money(venc)}</b></div><div class="kpi"><small>Vence en 7 días</small><b>${U.money(prox)}</b></div>
      <div class="kpi"><small>Cuentas abiertas</small><b>${P.length}</b></div></div>
    <div class="card"><h2>Cuentas por cobrar</h2><div class="tw"><table><tr><th>Cliente</th><th>Venta</th><th class="r">Total</th><th class="r">Saldo</th><th>Plan</th><th>Próximo pago</th><th>Estado</th><th></th></tr>
    ${sorted.map(s=>{const nd=Sales.nextDue(s),ov=this.overdue(s);return `<tr><td>${U.esc(Clients.name(s.clientId))}</td><td>${s.date}</td>
      <td class="r">${U.money(s.total)}</td><td class="r"><b>${U.money(Sales.balance(s))}</b></td>
      <td>${(s.plan||[]).length?`${s.plan.length} · ${FREQ[s.freq]||''}`:'<small>Sin plan</small>'}</td>
      <td>${nd?`${nd.due}<br><small>${U.money(U.r2(nd.amount-nd.paid))}</small>`:'—'}</td>
      <td>${ov>0?`<span class="low">Vencido ${U.money(ov)}</span>`:'<span class="ok">Al corriente</span>'}</td>
      <td class="r" style="white-space:nowrap"><button class="btn s" onclick="Collections.open('${s.id}')">Abonar</button> <button class="btn g s" onclick="Collections.wa('${s.id}')">💬 WhatsApp</button></td></tr>`}).join('')||'<tr><td colspan=8 class="empty">🎉 No hay saldos pendientes</td></tr>'}
    </table></div></div>${this.detail()}`}
};

/* ===== MÓDULO: Reportes ===== */
const Reports={
  from:'',to:'',
  filtered(){return Store.data.sales.filter(s=>(!this.from||s.date>=this.from)&&(!this.to||s.date<=this.to))},
  group(rows){ // rows: [key,value]
    const m={};rows.forEach(([k,v])=>m[k]=(m[k]||0)+v);
    return Object.entries(m).sort((a,b)=>b[1]-a[1])},
  openSet:new Set(), // recuerda qué tablas están abiertas al cambiar filtros
  tog(t,o){o?this.openSet.add(t):this.openSet.delete(t)},
  block(title,data,fmt=k=>U.esc(k),vf=U.money){
    const max=Math.max(1,...data.map(d=>d[1]));
    return `<details class="card rep" ${this.openSet.has(title)?'open':''} ontoggle="Reports.tog(this.dataset.t,this.open)" data-t="${U.esc(title)}"><summary>${title} <small>(${data.length})</small></summary><div class="tw" style="margin-top:8px"><table>${data.map(([k,v])=>`<tr><td>${fmt(k)}</td><td style="width:35%"><div class="bar"><i style="width:${Math.max(0,v)/max*100}%"></i></div></td><td class="r"><b>${vf(v)}</b></td></tr>`).join('')||'<tr><td class="empty">Sin datos</td></tr>'}</table></div></details>`},
  view(){
    const S=this.filtered(),total=S.reduce((a,s)=>a+s.total,0),inR=d=>(!this.from||d>=this.from)&&(!this.to||d<=this.to),
      PY=Store.data.sales.flatMap(s=>s.payments.filter(p=>inR(p.date))),
      ING=PY.filter(p=>p.method!=='donacion'),DON=PY.filter(p=>p.method==='donacion'), // las donaciones NO son ingreso
      cobrado=ING.reduce((a,p)=>a+p.amount,0),donado=DON.reduce((a,p)=>a+p.amount,0),
      porCobrar=Store.data.sales.reduce((a,s)=>a+Sales.balance(s),0),vencido=Store.data.sales.reduce((a,s)=>a+Collections.overdue(s),0),
      piezas=S.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.qty,0),0),
      descuentos=S.reduce((a,s)=>a+s.items.reduce((x,i)=>x+i.qty*(i.disc||0),0),0),
      ticket=S.length?total/S.length:0;
    const items=S.flatMap(s=>s.items.map(i=>({...i,date:s.date,client:Clients.name(s.clientId)})));
    const prod=i=>Catalog.get(i.pid)||{};
    const byDay=this.group(S.map(s=>[s.date,s.total])).sort((a,b)=>b[0].localeCompare(a[0]));
    const byMonth=this.group(S.map(s=>[s.date.slice(0,7),s.total])).sort((a,b)=>b[0].localeCompare(a[0]));
    const DOW=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
    const byDow=this.group(S.map(s=>[DOW[U.d(s.date).getDay()],s.total]));
    const byMethod=this.group(PY.map(p=>[p.method,p.amount])),byPayDay=this.group(ING.map(p=>[p.date,p.amount])).sort((a,b)=>b[0].localeCompare(a[0]));
    const byClient=this.group(S.map(s=>[Clients.name(s.clientId),s.total]));
    const byCat=this.group(items.map(i=>[i.cat,i.qty*i.price]));
    const byItem=this.group(items.map(i=>[i.name,i.qty*i.price]));
    const byUnits=this.group(items.map(i=>[i.name,i.qty]));
    const byDisc=this.group(items.filter(i=>i.disc>0).map(i=>[i.name,i.qty*i.disc]));
    const saldoCli=this.group(Store.data.sales.filter(s=>Sales.balance(s)>0).map(s=>[Clients.name(s.clientId),Sales.balance(s)]));
    const aging={'1-30 días':0,'31-60 días':0,'Más de 60 días':0};
    Store.data.sales.forEach(s=>(s.plan||[]).filter(i=>i.paid<i.amount&&i.due<U.today()).forEach(i=>{
      const d=Math.floor((U.d(U.today())-U.d(i.due))/864e5),k=d<=30?'1-30 días':d<=60?'31-60 días':'Más de 60 días';aging[k]+=U.r2(i.amount-i.paid)}));
    const low=Store.data.products.filter(p=>p.stock<=2).map(p=>[p.name,p.stock]).sort((a,b)=>a[1]-b[1]);
    const sold=new Set(items.map(i=>i.pid)),still=Store.data.products.filter(p=>!sold.has(p.id)&&p.stock>0).map(p=>[p.name,p.stock]);
    const stockVal=Store.data.products.reduce((a,p)=>a+p.stock*p.price,0);
    const stockCat=this.group(Store.data.products.map(p=>[p.cat,p.stock*p.price]));
    const pz=v=>v+' pzas';
    return `<div class="card"><h2>Reportes</h2><div class="row"><label>Desde<input type="date" value="${this.from}" onchange="Reports.from=this.value;App.render()"></label>
      <label>Hasta<input type="date" value="${this.to}" onchange="Reports.to=this.value;App.render()"></label>
      <button class="btn g" onclick="Reports.from=Reports.to=U.today();App.render()">Hoy</button>
      <button class="btn g" onclick="Reports.from=Reports.to='';App.render()">Todo</button></div></div>
    <div class="grid" style="margin-bottom:14px"><div class="kpi"><small>Vendido</small><b>${U.money(total)}</b></div>
      <div class="kpi"><small>Ingreso cobrado (sin donaciones)</small><b>${U.money(cobrado)}</b></div><div class="kpi"><small>Donaciones</small><b>${U.money(donado)}</b></div>
      <div class="kpi"><small>Por cobrar (total)</small><b>${U.money(porCobrar)}</b></div><div class="kpi"><small>Vencido</small><b style="color:var(--bad)">${U.money(vencido)}</b></div>
      <div class="kpi"><small>Piezas vendidas</small><b>${piezas}</b></div><div class="kpi"><small>Ticket promedio</small><b>${U.money(ticket)}</b></div>
      <div class="kpi"><small>Descuentos otorgados</small><b>${U.money(descuentos)}</b></div><div class="kpi"><small>Valor en inventario</small><b>${U.money(stockVal)}</b></div></div>
    <div class="two">${this.block('📅 Por día',byDay)}${this.block('🗓️ Por mes',byMonth)}${this.block('📆 Por día de la semana',byDow)}
    ${this.block('💳 Por método de pago (incluye donación)',byMethod,k=>METHODS[k])}${this.block('💰 Ingreso cobrado por día',byPayDay)}${this.block('👤 Por cliente',byClient)}
    ${this.block('🛋️ Por tipo de mueble',byCat)}
    ${this.block('🏷️ Descuentos por mueble',byDisc)}${this.block('📈 Piezas vendidas por mueble',byUnits,undefined,pz)}
    ${this.block('⚠️ Saldo pendiente por cliente',saldoCli)}${this.block('⏳ Antigüedad de saldo vencido',Object.entries(aging))}
    ${this.block('📉 Stock bajo (≤ 2 piezas)',low,undefined,pz)}${this.block('💤 Con stock y sin ventas en el periodo',still,undefined,pz)}
    ${this.block('🏬 Valor de inventario por tipo',stockCat)}</div>${this.block('📦 Por mueble',byItem)}`}
};

/* ===== MÓDULO: App (navegación) ===== */
const App={
  tab:'reports',
  tabs:[['reports','📊 Reportes'],['sale','🛒 Nueva venta'],['history','🧾 Historial'],['collect','💰 Cobranza'],['catalog','🛋️ Catálogo'],['clients','👥 Clientes']],
  views:{reports:()=>Reports.view(),sale:()=>Sales.view(),history:()=>History.view(),collect:()=>Collections.view(),catalog:()=>Catalog.view(),clients:()=>Clients.view()},
  go(t){this.tab=t;this.render()},
  hideAlert:false,
  alertBanner(){
    if(this.hideAlert||!Store.ready)return '';
    const a=Collections.alerts();if(!a.n)return '';
    return `<div class="card alert"><b>🔔 Cobranza:</b> ${a.ven.length?`${a.ven.length} cuenta(s) con pagos vencidos (${U.money(a.monto)})`:''}${a.ven.length&&a.hoy.length?' · ':''}${a.hoy.length?`${a.hoy.length} con pago que vence hoy`:''}
      <span style="float:right"><button class="btn s" onclick="App.hideAlert=true;App.go('collect')">Ver cobranza</button> <button class="btn g s" onclick="App.hideAlert=true;App.render()">Cerrar</button></span></div>`},
  render(){
    const n=Store.ready?Collections.alerts().n:0;
    U.$('nav').innerHTML=this.tabs.map(([k,l])=>`<button class="${k===this.tab?'on':''}" onclick="App.go('${k}')">${l}${k==='collect'&&n?` <span class="chip bad" style="margin:0 0 0 4px">${n}</span>`:''}</button>`).join('');
    U.$('app').innerHTML=this.alertBanner()+this.views[this.tab]();
  },
  async refresh(){await Store.load();this.render()},
  async init(){U.$('app').innerHTML='<div class="empty">Cargando datos…</div>';await Store.load();this.render()}
};
App.init();

</script></body></html>
